<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>14 de Febrero 💖</title>

<style>
   .page-content{
  display:flex;
  flex-direction:column;
  height:100%;
}


.page-gif{
  margin-top:10px;
  text-align:center;
}

.page-gif img{
  max-width:100%;
  max-height:90px;   /* antes 70 */
  image-rendering:pixelated;
}


*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Courier New', monospace;
}

body{
  background:#000;
  height:100vh;
  overflow:hidden;
  color:#fff;
}

/* ================= CRT + VHS ================= */
.crt{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  filter:contrast(1.15) brightness(0.85) saturate(1.2);
}

/* Scanlines */
.crt::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    rgba(0,0,0,0.12) 2px
  );
  pointer-events:none;
  z-index:999;
}

/* Flicker */
.crt::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,0.03);
  animation:flicker 0.12s infinite;
  pointer-events:none;
  z-index:999;
}

@keyframes flicker{
  0%{opacity:.95}
  50%{opacity:1}
  100%{opacity:.97}
}

/* VHS glitch */
@keyframes vhsGlitch{
  0%{transform:translate(0,0)}
  25%{transform:translate(-2px,1px)}
  50%{transform:translate(2px,-1px)}
  75%{transform:translate(-1px,0)}
  100%{transform:translate(0,0)}
}

.vhs{
  animation:vhsGlitch .18s infinite;
  filter:blur(.3px)
    drop-shadow(-1px 0 red)
    drop-shadow(1px 0 cyan);
}

/* ================= CORAZONES ================= */
.heart{
  position:absolute;
  bottom:-80px;
  width:8px;
  height:8px;
  animation:floatUp 5s linear forwards;
}

.heart::before{
  content:"";
  width:8px;
  height:8px;
  position:absolute;
  animation:pulse 1.2s ease-in-out infinite;
  box-shadow:
    16px 0 currentColor, 32px 0 currentColor,
    8px 8px currentColor, 16px 8px currentColor, 24px 8px currentColor, 32px 8px currentColor, 40px 8px currentColor,
    8px 16px currentColor, 16px 16px currentColor, 24px 16px currentColor, 32px 16px currentColor, 40px 16px currentColor,
    16px 24px currentColor, 24px 24px currentColor, 32px 24px currentColor,
    24px 32px currentColor;
}

@keyframes floatUp{
  to{
    transform:translateY(-120vh);
    opacity:0;
  }
}

@keyframes pulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.3); }
}

/* ================= CENTRO ================= */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
}

button{
  background:#ff4d6d;
  border:none;
  padding:8px 16px;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
  margin:4px;
}

/* ================= LIBRO ================= */
.book{
  width:420px;      /* más ancho */
  height:320px;     /* MUCHO más alto para texto + gif */
  perspective:2000px;
  margin-bottom:18px;
}



.book-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 1.6s ease;
}

.book.open .book-inner{
  transform:rotateY(-180deg);
}

.cover{
  position:absolute;
  width:100%;
  height:100%;
  background:#1f4ea8;
  border-radius:8px;
  backface-visibility:hidden;
}

.page{
  position:absolute;
  width:100%;
  height:100%;
  background:#f6f2d8;
  color:#000;
  transform:rotateY(180deg);
  border-radius:10px;
  padding:26px;     /* más aire */
  backface-visibility:hidden;
}


.page p{
  font-size:15.5px;
  line-height:1.4;
  white-space:pre-wrap;
}
.page-content p{
  flex-grow:1;
}


.cursor{
  display:inline-block;
  width:8px;
  background:#000;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0}
}

/* 🔒 OCULTAR BOTÓN SIGUIENTE AL INICIO */
#nextBtn{
  display:none;
}

/* ================= 📱 RESPONSIVE CELULAR ================= */
@media (max-width: 600px){

  .center{
    width:100%;
    padding:12px;
  }

  .book{
    width:92vw;          /* casi todo el ancho del celular */
    height:65vh;         /* alto suficiente para texto + gif */
    max-width:440px;
    max-height:520px;
  }

  .page{
    padding:20px;
  }

  .page p{
    font-size:14px;
    line-height:1.45;
  }

  .page-gif img{
    max-height:80px;
  }

  button{
    font-size:13px;
    padding:7px 14px;
  }
}


</style>
</head>

<body>
<audio id="bgMusic" src="musica.mp3" loop></audio>
<div class="crt vhs" id="screen">

  <div class="center">
    <div class="book" id="book">
      <div class="book-inner">
        <div class="cover"></div>
        <div class="page">
  <div class="page-content">
    <p id="rpgText"></p><span class="cursor"></span>

    <div class="page-gif">
      <img id="pageGif" src="gif1.gif" alt="">
    </div>
  </div>
</div>
      </div>
    </div>

    <button id="openBtn">Ábreme</button>
    <button id="nextBtn" onclick="nextPage()">Siguiente 💌</button>
    <button onclick="toggleVHS()">📼 VHS</button>
  </div>

</div>

<script>
/* ❤️ corazones */
setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart';
  h.style.left=Math.random()*100+'vw';
  h.style.color=['#ff4d6d','#ff7aa2','#ff1e56'][Math.floor(Math.random()*3)];
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
},220);

/* 📼 VHS ON/OFF */
function toggleVHS(){
  document.getElementById('screen').classList.toggle('vhs');
}
/* 🎵 música */
const music=document.getElementById('bgMusic');

const gifs=[
  "gif1.gif",
  "gif2.gif",
  "gif3.gif",
  "gif4.gif",
  "gif5.gif"
];

const pageGif=document.getElementById('pageGif');

/* 📖 libro + páginas */
const pages=[
`Feliz 14 de Febrero linda💖
realmente creo firmemente que
soy muy afortunado por el simple 
hecho de haberte
conocido.`,

`Realmente estoy encantado
con vos y creo que cada que puedo
te lo digo jaja. Odalis de verdad eres 
una chica muy, muy especial 
y creo esto cada día más. ✨`,

`Odalis eres una chica increible,
eres muy hermosa y tu personalidad y 
tu alma brillan de una manera unica,
tal manera que a mi simplemente me atrapan,
y la verdad disfruto cada conversacion 
que tengo con vos. ❣️`,

`Me interesa seguir conociendo cada lado de ti.
Que Dios decida nuestro destino, pero 
ojalá me conceda el regalo de coincidir 
con alguien tan especial como tu
Odalis Nallely Barahona Figueroa. 💕
Pdta: 
Espero el regalo te guste. 💗`,

`Te dejo que disfrutes el tema
💓`
];

let pageIndex=0;
let charIndex=0;
const textBox=document.getElementById('rpgText');
const nextBtn=document.getElementById('nextBtn');

function typeText(){
  if(charIndex < pages[pageIndex].length){
    textBox.textContent += pages[pageIndex][charIndex++];
    setTimeout(typeText,40);
  }
}

/* 📘 abrir libro */
document.getElementById('openBtn').onclick=()=>{
  document.getElementById('book').classList.add('open');
  document.getElementById('openBtn').style.display='none';
  nextBtn.style.display='inline-block';
  music.play(); // 🎵 INICIA AQUÍ
  typeText();
};

/* 💌 siguiente página */
function nextPage(){
  if(pageIndex < pages.length-1){
    pageIndex++;
    charIndex=0;
    textBox.textContent="";
    pageGif.src = gifs[pageIndex];
    typeText();
  }else{
    nextBtn.style.display='none';
  }
}
</script>

</body>
</html>
